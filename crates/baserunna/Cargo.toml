[package]
name = "baserunna"
version.workspace = true
edition.workspace = true
description = "object storage database host"
license.workspace = true

[features]
default = ["cloud"]
cloud = ["baserunna-storage/cloud", "dep:reqwest"]

[dependencies]
baserunna-api.workspace = true
baserunna-client.workspace = true
baserunna-storage.workspace = true
baserunna-util.workspace = true
aws-lc-rs.workspace = true
axum = { workspace = true, features = ["http1", "json", "query", "form", "tokio", "matched-path", "original-uri"] }
bytes.workspace = true
futures-util = { workspace = true, features = ["std"] }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "signal", "test-util"] }
tower = { workspace = true, features = ["util"] }
reqwest = { workspace = true, features = ["rustls", "json"], optional = true }

[dev-dependencies]
baserunna-client = { workspace = true, features = ["reqwest"] }
libc.workspace = true

[[bench]]
name = "throughput"
harness = false

[[example]]
name = "loadgen"
required-features = ["cloud"]
