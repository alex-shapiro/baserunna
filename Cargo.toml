[package]
name = "baserunna"
version = "0.1.0"
edition = "2024"
description = "Horizontally scalable, object-storage-backed transactional KV, table and stream databases"
license = "MIT OR Apache-2.0"

[features]
default = ["cloud"]
# Real cloud object stores (S3, GCS, Azure) and outbound HTTPS for Google OAuth.
cloud = ["dep:object_store", "dep:reqwest"]

[dependencies]
aws-lc-rs = "1.18"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "form", "tokio", "matched-path", "original-uri"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
zstd = { version = "0.13", default-features = false }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "signal", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
object_store = { version = "0.14", default-features = false, features = ["aws", "gcp", "azure"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }

[[bench]]
name = "throughput"
harness = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

# Fast incremental rebuilds for mutation testing (`cargo mutants`).
[profile.mutants]
inherits = "test"
opt-level = 0
debug = false
incremental = true
codegen-units = 256

[profile.mutants.package."*"]
opt-level = 2
