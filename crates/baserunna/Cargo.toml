[package]
name = "baserunna"
version.workspace = true
edition.workspace = true
description = "object storage database host"
license.workspace = true

[features]
default = ["cloud"]
cloud = ["dep:object_store", "dep:reqwest"]

[dependencies]
baserunna-api.workspace = true
baserunna-client.workspace = true
aws-lc-rs = "1.18"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "form", "tokio", "matched-path", "original-uri"] }
bytes = "1"
crc32c = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
zstd = { version = "0.13", default-features = false }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "signal", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
object_store = { version = "0.14", default-features = false, features = ["aws"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }

[dev-dependencies]
libc = "0.2"

[[bench]]
name = "throughput"
harness = false

[[example]]
name = "loadgen"
required-features = ["cloud"]
