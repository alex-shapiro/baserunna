[package]
name = "baserunna"
version.workspace = true
edition.workspace = true
description = "object storage database host"
license.workspace = true

[features]
default = ["cloud"]
cloud = ["server", "dep:object_store", "dep:reqwest"]
# The HTTP server, the OS environment, and the sandbox host. Without it the
# crate builds for the WebAssembly guest.
# The build that runs inside the WebAssembly sandbox.
guest = ["dep:sha2", "handlers"]
# The HTTP handlers of database routes, without a server. The guest and the server both use them.
handlers = ["dep:axum", "dep:tower"]
server = ["handlers", "axum/http1", "axum/tokio", "dep:aws-lc-rs", "dep:hyper", "dep:hyper-util", "dep:wasmtime", "tokio/net", "tokio/signal", "tokio/rt-multi-thread"]

[dependencies]
baserunna-api.workspace = true
baserunna-core.workspace = true
baserunna-client.workspace = true
aws-lc-rs = { version = "1.18", optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["json", "query", "form", "matched-path", "original-uri"] }
bytes = { version = "1", features = ["serde"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
crc32c = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", optional = true, features = ["client", "http1"] }
hyper-util = { version = "0.1", optional = true, features = ["client-legacy", "http1", "tokio"] }
parking_lot.workspace = true
serde = { version = "1", features = ["derive"] }
zstd = { version = "0.13", default-features = false }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "test-util"] }
wasmtime = { version = "48", optional = true, default-features = false, features = ["cranelift", "runtime", "async", "std"] }
tower = { version = "0.5", optional = true, default-features = false, features = ["util"] }
object_store = { version = "0.14", default-features = false, features = ["aws"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
baserunna-client = { workspace = true, features = ["reqwest"] }
libc = "0.2"

[[bench]]
name = "throughput"
harness = false

[[example]]
name = "loadgen"
required-features = ["cloud"]
