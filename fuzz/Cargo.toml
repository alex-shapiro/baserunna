[package]
name = "baserunna-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
baserunna = { path = "../crates/baserunna", default-features = false }
baserunna-api = { path = "../crates/baserunna-api" }
baserunna-client = { path = "../crates/baserunna-client", default-features = false }
http = "1"
tokio = { version = "1", features = ["rt", "time"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone workspace so the main crate never builds these.
[workspace]
members = ["."]

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "segment"
path = "fuzz_targets/segment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tuple_and_row"
path = "fuzz_targets/tuple_and_row.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ops_json"
path = "fuzz_targets/ops_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_txn"
path = "fuzz_targets/http_txn.rs"
test = false
doc = false
bench = false

[[bin]]
name = "change_pos"
path = "fuzz_targets/change_pos.rs"
test = false
doc = false
