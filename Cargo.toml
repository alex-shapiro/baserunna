[workspace]
resolver = "3"
members = ["crates/baserunna", "crates/baserunna-api", "crates/baserunna-client"]
default-members = ["crates/baserunna", "crates/baserunna-api", "crates/baserunna-client"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPLv3"

[workspace.dependencies]
baserunna-api = { path = "crates/baserunna-api" }
baserunna-client = { path = "crates/baserunna-client", default-features = false }
bytes = "1"
http = "1"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_urlencoded = "0.7"
tokio = { version = "1", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

# Fast incremental rebuilds for mutation testing (`cargo mutants`).
[profile.mutants]
inherits = "test"
opt-level = 0
debug = false
incremental = true
codegen-units = 256

[profile.mutants.package."*"]
opt-level = 2
